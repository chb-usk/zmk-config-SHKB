# Right half – dongle-mode peripheral
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610_ALT=y
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=8

CONFIG_ZMK_BATTERY_REPORTING=y

# ── 接続安定性 ──────────────────────────────────────────────────────────────
CONFIG_ZMK_SLEEP=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ── レイヤーLED ─────────────────────────────────────────────────────────────
# XIAO BLEのRGB LEDを電源ON時のみ電池残量（緑/黄/赤）で2秒点灯（src/layer_led.c）。
# レイヤー表示は消費電力を抑えるため左手側のみで行い、右手側では無効化
CONFIG_SHKB_LAYER_LED=y
CONFIG_SHKB_LAYER_LED_SHOW_LAYERS=n
