# Left half – dongle-mode peripheral
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_BATTERY_REPORTING=y

# ── 接続安定性 ──────────────────────────────────────────────────────────────
# スリープに入るとドングルとの接続が切れるため無効化
CONFIG_ZMK_SLEEP=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ── レイヤーLED ─────────────────────────────────────────────────────────────
# XIAO BLEのRGB LEDを、電源ON時は電池残量（緑/黄/赤）で2秒、
# セントラルから通知されたレイヤー3-6 切替時はレイヤー色で1秒だけ点灯
# （src/layer_led.c）。レイヤー表示はトラックボール側より消費電力が少ない左手側のみ
CONFIG_SHKB_LAYER_LED=y
