# Left half – dongle-mode peripheral
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_BATTERY_REPORTING=y

# ── 接続安定性 ──────────────────────────────────────────────────────────────
# スリープに入るとドングルとの接続が切れるため無効化
CONFIG_ZMK_SLEEP=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
