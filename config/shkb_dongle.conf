# Dongle (XIAO BLE or Prospector) – Central role
CONFIG_ZMK_KEYBOARD_NAME="SHKB"

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Two peripherals: left half + right half
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# Dongle connects to host via USB
CONFIG_ZMK_USB=y

# Pointing / trackball (receives from right peripheral)
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y

# Proxy each peripheral's battery level to the host
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# ZMK Studio (dongle / Prospector mode)
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y

# 接続安定性向上
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_CTLR_PHY_2M=n

# Log output for debug
# CONFIG_ZMK_USB_LOGGING=n
# CONFIG_LOG_LEVEL_DBG=n

# Prospector brightness setting
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80
