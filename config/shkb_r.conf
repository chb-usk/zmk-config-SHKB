# 左右間の通信を有効化
CONFIG_ZMK_SPLIT=y

# トラックボール（PMW3610）の設定
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610_ALT=y
# Report interval in ms (lower = higher frequency = smoother movement)
# 8 ms ≈ 125 Hz (default was 12 ms ≈ 83 Hz)
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=8

#Mouse config ---------------------
# CONFIG_PMW3610_ALT_INVERT_X=y
# CONFIG_PMW3610_ALT_INVERT_Y=y
# CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12
# CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=300

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

#ZMK Studio (normal mode / dongleless) ----------
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y

# ── BLE 接続安定性 (Windows 対策) ──────────────────────────────────────────
# ディープスリープ中はアドバタイジングが停止しWindowsが再接続できなくなる上、
# 右半分がディープスリープに入ると左右間のsplit接続も切れるため無効化
CONFIG_ZMK_SLEEP=n

# Windowsと相性の良い接続インターバル（デフォルト min=6/max=12 は
# Windowsのパラメータ再交渉タイミングで切断される原因になる）。
# 右半分はトラックボール（8ms周期でサンプリング）を直接扱うため、
# 接続間隔がHIDレポート送信頻度の上限になり動きの機敏さに直結する。
# 安定性を保ちつつセンサーの周期に近づけるため min=6(7.5ms)/max=9(11.25ms) に短縮。
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
# 送るデータがない接続イベントを最大30回まで省略できるようにして待機電力を下げる
# （ZMKの既定値）。キー・ボール入力は次の接続イベントですぐ送るので入力遅延は増えない。
# 0 にすると無操作でも全イベントに応答し続け、右手の電池が1日約20%減っていた。
# Windowsで切断が増える場合は 10〜16 程度に下げて様子を見る。
# 監視タイムアウト 400(4s) > (1+30)×11.25ms×2 ≈ 0.7s を満たしている。
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# TX出力は既定値（0 dBm）に戻す。+8 dBm は送信のたびの電流が約3倍になり、
# 常時通信するセントラル（右手）の電池消費が大きい。キーボードとPCが近い通常の
# 使い方では 0 dBm で十分。届きにくい場合は +4 dBm（下の行）を試す。
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# CONFIG_BT_CTLR_TX_PWR_PLUS_4=y

# ── レイヤーLED ─────────────────────────────────────────────────────────────
# レイヤー切替を左手側へ通知（点灯は左手のXIAO BLEのみ。src/layer_led_notify.c）
CONFIG_SHKB_LAYER_LED_NOTIFY=y

# XIAO BLEのRGB LEDを電源ON時のみ電池残量（緑/黄/赤）で2秒点灯（src/layer_led.c）。
# レイヤー表示は消費電力を抑えるため左手側のみで行い、右手側では無効化
CONFIG_SHKB_LAYER_LED=y
CONFIG_SHKB_LAYER_LED_SHOW_LAYERS=n

# 電源ON時（電池残量表示の後）とBTプロファイル切替時に、接続先プロファイルの色で
# 2秒間点滅（Profile 0:赤 / 1:青 / 2:緑 / 3:マゼンタ / 4:黄）。
# プロファイルを管理するセントラル（ノーマルモードの右手側）のみ
CONFIG_SHKB_LAYER_LED_PROFILE=y

# ── BTプロファイル別ベースレイヤー ─────────────────────────────────────────
# 電源ON時（保存済みプロファイルの読込後）とプロファイル切替時に、プロファイルに
# 対応するベースレイヤーへ切り替える（src/profile_base_layer.c）。
# 既定: BT0/1 → Layer0(mac) / BT2/3 → Layer1(win) / BT4 → Layer2(iPad)
CONFIG_SHKB_PROFILE_BASE_LAYER=y

# BT_SEL で選んだプロファイルは既定では60秒後にフラッシュへ保存されるため、
# 選択後すぐに電源OFFすると保存されず、次回は前のプロファイルで起動してしまう。
# 2秒で保存して、電源OFF/ONでも選択したプロファイル（とベースレイヤー）を維持する
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=2000

# 左手（スプリットのペリフェラル）との接続間隔を 7.5ms(6) → 15ms(12) に広げる。
# セントラルの右手は左手との接続イベントを省略できず毎回起きる必要があり、
# 待機中の電池消費の大半はここと考えられる（左手はほぼ減らないのに右手は1日約17%）。
# 右手が起きる回数が半分になる代わりに、左手のキー入力が最大約7.5ms遅れる。
# 打鍵の遅れが気になる場合は 9(11.25ms) を試す。既定値は 6(7.5ms)。
# 監視タイムアウト 400(4s) > (1+30)×15ms×2 ≈ 0.93s を満たしている。
CONFIG_ZMK_SPLIT_BLE_PREF_INT=12
