# 左右間の通信を有効化
CONFIG_ZMK_SPLIT=y

# トラックボール（PMW3610）の設定
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
# DYA Studio のトラックボールタブに対応した cormoran 版ドライバー
# （旧: badjeff 版 CONFIG_PMW3610_ALT）
CONFIG_PMW3610=y
# Report interval in ms (lower = higher frequency = smoother movement)
# 8 ms ≈ 125 Hz (default was 12 ms ≈ 83 Hz)
CONFIG_PMW3610_REPORT_INTERVAL_MIN=8
# 旧ドライバーでは devicetree の invert-x で反転していた（cormoran 版は Kconfig で指定）
CONFIG_PMW3610_INVERT_X=y

# ── センサーの省電力モード（動き出しの遅れ対策）──────────────────────────────
# PMW3610 は止まると RUN → REST1 → REST2 → REST3 と段階的に省電力モードへ移り、
# 動きを見に行く間隔が長くなる（既定 40 / 100 / 500ms）。その間隔ぶん、
# 触り始めの最初の動きが遅れて感じられる。
# 間隔を短くし、RUN を長めに保つ（右手の待機電流は少し増える）。
# RUN を保つ時間（止めてから REST1 に入るまで）: 既定 128ms → 500ms
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=500
# REST1（止めて 0.5〜5 秒）の読み取り間隔: 既定 40ms → 20ms
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
# REST2（5〜17 秒）の読み取り間隔: 既定 100ms → 50ms
CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=50
# REST3（17 秒以降 = しばらく触らないとき）の読み取り間隔: 既定 500ms → 100ms
CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=100

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

#ZMK Studio (normal mode / dongleless) ----------
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y

# ── BLE 接続安定性 (Windows 対策) ──────────────────────────────────────────
# ディープスリープ中はアドバタイジングが停止しWindowsが再接続できなくなる上、
# 右半分がディープスリープに入ると左右間のsplit接続も切れるため、既定ではスリープしない
# スリープ機能自体は入れておき、DYA Studio の「設定」タブで電源設定を変更・保存
# できるようにする（SLEEP=n だと保存時に必ずエラーになる）。
# 既定値 0 = スリープしない。Studio で時間を設定したユーザーだけスリープが有効になる。
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=0

# Windowsと相性の良い接続インターバル（デフォルト min=6/max=12 は
# Windowsのパラメータ再交渉タイミングで切断される原因になる）。
# 右半分はトラックボール（8ms周期でサンプリング）を直接扱うため、
# 接続間隔がHIDレポート送信頻度の上限になり動きの機敏さに直結する。
# 安定性を保ちつつセンサーの周期に近づけるため min=6(7.5ms)/max=9(11.25ms) に短縮。
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
# 送るデータがない接続イベントを最大30回まで省略できるようにして待機電力を下げる
# （ZMKの既定値）。キー・ボール入力は次の接続イベントですぐ送るので入力遅延は増えない。
# 0 にすると無操作でも全イベントに応答し続け、右手の電池が1日約20%減っていた。
# Windowsで切断が増える場合は 10〜16 程度に下げて様子を見る。
# 監視タイムアウト 400(4s) > (1+30)×11.25ms×2 ≈ 0.7s を満たしている。
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# 上の希望値（7.5〜11.25ms）は macOS に拒否され、接続時の 30ms のままになる
# （実測: i24l0t72）。BT 接続のトラックボールが遅く感じる原因だった。
# 接続から数秒たっても 15ms より遅い場合は、15ms 固定を要求し直す
# （macOS で受け入れられることを実測。src/conn_interval_fallback.c）。
CONFIG_SHKB_CONN_INTERVAL_FALLBACK=y

# TX出力は既定値（0 dBm）に戻す。+8 dBm は送信のたびの電流が約3倍になり、
# 常時通信するセントラル（右手）の電池消費が大きい。キーボードとPCが近い通常の
# 使い方では 0 dBm で十分。届きにくい場合は +4 dBm（下の行）を試す。
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# CONFIG_BT_CTLR_TX_PWR_PLUS_4=y

# ── レイヤーLED ─────────────────────────────────────────────────────────────
# レイヤー切替を左手側へ通知（点灯は左手のXIAO BLEのみ。src/layer_led_notify.c）
CONFIG_SHKB_LAYER_LED_NOTIFY=y

# XIAO BLEのRGB LEDを電源ON時のみ電池残量（緑/黄/赤）で2秒点灯（src/layer_led.c）。
# レイヤー表示は消費電力を抑えるため左手側のみで行い、右手側では無効化
CONFIG_SHKB_LAYER_LED=y
CONFIG_SHKB_LAYER_LED_SHOW_LAYERS=n

# 電源ON時（電池残量表示の後）とBTプロファイル切替時に、接続先プロファイルの色で
# 2秒間点滅（Profile 0:赤 / 1:青 / 2:緑 / 3:マゼンタ / 4:黄）。
# プロファイルを管理するセントラル（ノーマルモードの右手側）のみ
CONFIG_SHKB_LAYER_LED_PROFILE=y

# ── BTプロファイル別ベースレイヤー ─────────────────────────────────────────
# DYA Studio ブランチでは自作の src/profile_base_layer.c は使わず、
# zmk-feature-default-layer（下の「接続」タブ）に任せる。
# CONFIG_SHKB_PROFILE_BASE_LAYER=y

# BT_SEL で選んだプロファイルは既定では60秒後にフラッシュへ保存されるため、
# 選択後すぐに電源OFFすると保存されず、次回は前のプロファイルで起動してしまう。
# 2秒で保存して、電源OFF/ONでも選択したプロファイル（とベースレイヤー）を維持する
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=2000

# 左手（スプリットのペリフェラル）との接続間隔を 7.5ms(6) → 15ms(12) に広げる。
# セントラルの右手は左手との接続イベントを省略できず毎回起きる必要があり、
# 待機中の電池消費の大半はここと考えられる（左手はほぼ減らないのに右手は1日約17%）。
# 右手が起きる回数が半分になる代わりに、左手のキー入力が最大約7.5ms遅れる。
# 打鍵の遅れが気になる場合は 9(11.25ms) を試す。既定値は 6(7.5ms)。
# 監視タイムアウト 400(4s) > (1+30)×15ms×2 ≈ 0.93s を満たしている。
CONFIG_ZMK_SPLIT_BLE_PREF_INT=12

# ════════════════════════════════════════════════════════════════════════════
# DYA Studio 対応（右手 = スプリットのセントラル）
# 参考: soraclock/DYA (moNa2) / DYA Studio 開発者ガイド
# ════════════════════════════════════════════════════════════════════════════

# Zephyr 4.1 では CONSOLE が既定で有効になるが不要
CONFIG_CONSOLE=n

# ── コア ────────────────────────────────────────────────────────────────────
# 左右の設定同期（cormoran/zmk main+dya の機能）
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
# BLE 接続時のキーマップ読み込み高速化
CONFIG_ZMK_FAST_KEYMAP=y
CONFIG_ZMK_FAST_KEYMAP_STUDIO_RPC=y
CONFIG_ZMK_FAST_KEYMAP_DEFAULT_LAYER=y

# ── キーマップ / マクロ / コンボ タブ ───────────────────────────────────────
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS_IN_BINDINGS=y
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
# 押したキーを Studio 上で可視化
CONFIG_ZMK_INPUT_STREAM_FEATURE=y
CONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y
# キーマップ表示にトラックボールを描く（shkb_r.overlay の trackball_layout）
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE=y
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE_STUDIO_RPC=y

# ── トラックボール タブ ─────────────────────────────────────────────────────
# PMW3610 の Studio RPC（トラックボールタブの「PMW3610 ドライバー」欄・診断タブの
# センサー診断）は無効化。Studio 接続時に送られる情報取得要求が、ドライバーの
# ロックを取らずにセンサーのレジスタを読むため、トラックボールの読み取り処理と
# 衝突して右手が固まる疑いがある（接続時にキー・ボールとも無反応になり、
# リセットまで戻らなかった）。感度などの調整は runtime input processor 側で行う。
# CONFIG_ZMK_PMW3610_STUDIO_RPC=y
CONFIG_ZMK_PMW3610_CUSTOM_SETTINGS=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# ── 接続 タブ ───────────────────────────────────────────────────────────────
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y
# 接続先 / OS ごとのデフォルトレイヤー。Layer 0(mac)〜2(iPad) を対象にする。
# 接続先ごとの割り当ては Studio の「接続」タブで設定する。
CONFIG_ZMK_DEFAULT_LAYER=y
CONFIG_ZMK_DEFAULT_LAYER_MIN_INDEX=0
CONFIG_ZMK_DEFAULT_LAYER_MAX_INDEX=2
CONFIG_ZMK_DEFAULT_LAYER_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION_USB=y
CONFIG_ZMK_OS_DETECTION_BLE=y
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=y

# ── 設定 タブ ───────────────────────────────────────────────────────────────
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# ── 診断 タブ ───────────────────────────────────────────────────────────────
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y
# 低優先度キュー（電池残量・Studio 通知・設定保存など）の停止監視は外す。
# 監視していると 10 秒止まっただけで再起動し、BT が切れていた
# （lowprio_workq のフリーズが 1〜3 分ごとに記録された）。
# モジュール作者もスプリットのセントラルではこの設定を推奨している
# （watchdog-split-central スニペット）。キー入力を処理するシステムキューの
# 監視とクラッシュ記録はそのまま残る。
CONFIG_ZMK_WATCHDOG_FREEZE_MONITOR_LOWPRIO_QUEUE=n
# キースイッチ診断（診断タブの「キースイッチ」: キー押下統計・チャタリング検出）。
# チャーリープレックス kscan にも対応。左手の統計は分割リレー経由で取得する
# （両半分で RELAY_EVENT_DATA_LEN=256 が必要）。
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_SPLIT=y

# ── Custom Studio Protocol を複数使う場合の推奨値（開発者ガイド）──────────
CONFIG_SETTINGS=y
CONFIG_HEAP_MEM_POOL_SIZE=24576
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=768
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256
# ガイドの推奨は CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000 だが、BTプロファイル選択
# 直後の電源OFFに備えて上の 2000 を維持している

# ── BLE コントローラの遅延アサートを無効化 ───────────────────────────────────
# Zephyr 4.1 の BLE コントローラは、無線イベントの準備が CPU 負荷で間に合わないと
# LL_ASSERT_OVERHEAD でカーネル Oops（再起動）する（既定 y）。DYA Studio 接続中の
# USB 通信や設定保存で発生し、lll_adv.c / lll_central.c の prepare_cb で
# 右手が 30 秒〜数分ごとにクラッシュしていた（DYA Studio のウォッチドッグ記録より）。
# n にすると遅れたイベントを 1 回スキップするだけになる（連続しなければ切断されない）。
# この項目は「Advanced features」メニュー内にあり、ADVANCED_FEATURES=y でないと
# n を指定しても無視される（ビルドログに "assigned n but got y" と警告が出る）。
# ADVANCED_FEATURES はメニューを表示するだけで、他の項目の既定値は変わらない。
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n
