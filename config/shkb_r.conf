# 左右間の通信を有効化
CONFIG_ZMK_SPLIT=y

# トラックボール（PMW3610）の設定
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610_ALT=y
# Report interval in ms (lower = higher frequency = smoother movement)
# 8 ms ≈ 125 Hz (default was 12 ms ≈ 83 Hz)
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=8

#Mouse config ---------------------
# CONFIG_PMW3610_ALT_INVERT_X=y
# CONFIG_PMW3610_ALT_INVERT_Y=y
# CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12
# CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=300

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y

# ── 接続安定性 ──────────────────────────────────────────────────────────────
# 右半分がディープスリープに入ると左右間のsplit接続が切れるため無効化
CONFIG_ZMK_SLEEP=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y