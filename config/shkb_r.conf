# 左右間の通信を有効化
CONFIG_ZMK_SPLIT=y

# トラックボール（PMW3610）の設定
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610_ALT=y
# Report interval in ms (lower = higher frequency = smoother movement)
# 8 ms ≈ 125 Hz (default was 12 ms ≈ 83 Hz)
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=8

#Mouse config ---------------------
# CONFIG_PMW3610_ALT_INVERT_X=y
# CONFIG_PMW3610_ALT_INVERT_Y=y
# CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12
# CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=300

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

#ZMK Studio (normal mode / dongleless) ----------
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y

# ── BLE 接続安定性 (Windows 対策) ──────────────────────────────────────────
# ディープスリープ中はアドバタイジングが停止しWindowsが再接続できなくなる上、
# 右半分がディープスリープに入ると左右間のsplit接続も切れるため無効化
CONFIG_ZMK_SLEEP=n

# Windowsと相性の良い接続インターバル（デフォルト min=6/max=12 は
# Windowsのパラメータ再交渉タイミングで切断される原因になる）。
# 右半分はトラックボール（8ms周期でサンプリング）を直接扱うため、
# 接続間隔がHIDレポート送信頻度の上限になり動きの機敏さに直結する。
# 安定性を保ちつつセンサーの周期に近づけるため min=6(7.5ms)/max=9(11.25ms) に短縮。
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# TX出力を最大（+8 dBm）にして電波到達性を改善
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ── レイヤーLED ─────────────────────────────────────────────────────────────
# レイヤー切替を左手側へ通知（点灯は左手のXIAO BLEのみ。src/layer_led_notify.c）
CONFIG_SHKB_LAYER_LED_NOTIFY=y

# XIAO BLEのRGB LEDを電源ON時のみ電池残量（緑/黄/赤）で2秒点灯（src/layer_led.c）。
# レイヤー表示は消費電力を抑えるため左手側のみで行い、右手側では無効化
CONFIG_SHKB_LAYER_LED=y
CONFIG_SHKB_LAYER_LED_SHOW_LAYERS=n

# 電源ON時（電池残量表示の後）とBTプロファイル切替時に、接続先プロファイルの色で
# 2秒間点滅（Profile 0:赤 / 1:青 / 2:緑 / 3:マゼンタ / 4:黄）。
# プロファイルを管理するセントラル（ノーマルモードの右手側）のみ
CONFIG_SHKB_LAYER_LED_PROFILE=y
