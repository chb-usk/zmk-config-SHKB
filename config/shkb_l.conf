#Mouse config ---------------------
#CONFIG_PMW3610_INVERT_X=n
#CONFIG_PMW3610_INVERT_Y=y
# CONFIG_PMW3610_REPORT_INTERVAL_MIN=12
# CONFIG_PMW3610_LOG_LEVEL_DBG=y
# CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=300


# 左右間の通信を有効化　-------------------
CONFIG_ZMK_SPLIT=y

# マウス（トラックボール）イベントを受信するために必要
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y

# ── BLE 接続安定性 ──────────────────────────────────────────────────────────
# 左半分がディープスリープに入ると左右間のsplit接続が切れるため無効化
CONFIG_ZMK_SLEEP=n

# TX出力を最大（+8 dBm）にして電波到達性を改善
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
