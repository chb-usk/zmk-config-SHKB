#Mouse config ---------------------
#CONFIG_PMW3610_INVERT_X=n
#CONFIG_PMW3610_INVERT_Y=y
# CONFIG_PMW3610_REPORT_INTERVAL_MIN=12
# CONFIG_PMW3610_LOG_LEVEL_DBG=y
# CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=300


# 左右間の通信を有効化　-------------------
CONFIG_ZMK_SPLIT=y

# マウス（トラックボール）イベントを受信するために必要
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

#ZMK Studio (normal mode / dongleless) ----------
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y

# ── BLE 接続安定性 (Windows 対策) ──────────────────────────────────────────
# ディープスリープ中はアドバタイジングが停止しWindowsが再接続できなくなる
# デスクトップ用途では接続性を優先してスリープを無効化
CONFIG_ZMK_SLEEP=n

# Windowsと相性の良い接続インターバル（デフォルト min=6/max=12 は
# Windowsのパラメータ再交渉タイミングで切断される原因になる）
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# TX出力を最大（+8 dBm）にして電波到達性を改善
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
