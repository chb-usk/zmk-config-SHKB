#Mouse config ---------------------
#CONFIG_PMW3610_INVERT_X=n
#CONFIG_PMW3610_INVERT_Y=y
# CONFIG_PMW3610_REPORT_INTERVAL_MIN=12
# CONFIG_PMW3610_LOG_LEVEL_DBG=y
# CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=300


# 左右間の通信を有効化　-------------------
CONFIG_ZMK_SPLIT=y

# マウス（トラックボール）イベントを受信するために必要
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y

# ── BLE 接続安定性 ──────────────────────────────────────────────────────────
# 左半分がディープスリープに入ると左右間のsplit接続が切れるため、既定ではスリープしない
# スリープ機能自体は入れておき、DYA Studio の「設定」タブで電源設定を変更・保存
# できるようにする（SLEEP=n だと保存時に必ずエラーになる）。
# 既定値 0 = スリープしない。Studio で時間を設定したユーザーだけスリープが有効になる。
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=0

# TX出力は既定値（0 dBm）にする（省電力のため。2026-11 に +8 dBm から変更）。
# 以前は電波到達性の改善のため +8 dBm にしていたが、左右の接続の不安定さは
# 別の要因だった可能性がある。左右の接続が途切れるようなら +4 dBm（下の行）→
# +8 dBm の順に戻して試す。
# CONFIG_BT_CTLR_TX_PWR_PLUS_4=y
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ── レイヤーLED ─────────────────────────────────────────────────────────────
# XIAO BLEのRGB LEDを、電源ON時は電池残量（緑/黄/赤）で2秒、
# セントラルから通知されたレイヤー3-6 切替時はレイヤー色で1秒だけ点灯
# （src/layer_led.c）。レイヤー表示はトラックボール側より消費電力が少ない左手側のみ
CONFIG_SHKB_LAYER_LED=y

# ════════════════════════════════════════════════════════════════════════════
# DYA Studio 対応（左手 = スプリットのペリフェラル）
# ════════════════════════════════════════════════════════════════════════════

# Zephyr 4.1 では CONSOLE が既定で有効になるが不要
CONFIG_CONSOLE=n

# 左右の設定同期
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256
# 設定タブ（左手のアイドル/スリープ設定）
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y

# 設定の永続化
CONFIG_SETTINGS=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048

# ── BLE コントローラの遅延アサートを無効化 ───────────────────────────────────
# Zephyr 4.1 の BLE コントローラは、無線イベントの準備が CPU 負荷で間に合わないと
# LL_ASSERT_OVERHEAD でカーネル Oops（再起動）する（既定 y）。DYA Studio 接続中の
# USB 通信や設定保存で発生し、lll_adv.c / lll_central.c の prepare_cb で
# 右手が 30 秒〜数分ごとにクラッシュしていた（DYA Studio のウォッチドッグ記録より）。
# n にすると遅れたイベントを 1 回スキップするだけになる（連続しなければ切断されない）。
# この項目は「Advanced features」メニュー内にあり、ADVANCED_FEATURES=y でないと
# n を指定しても無視される（ビルドログに "assigned n but got y" と警告が出る）。
# ADVANCED_FEATURES はメニューを表示するだけで、他の項目の既定値は変わらない。
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n

# キースイッチ診断（右手の Studio から左手のキー統計・チャタリングを読む）
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_SPLIT=y

# ── 安定性の記録（左手）────────────────────────────────────────────────────
# 放置後に左手が動かなくなり、リセットまで戻らない症状の切り分け用。
# クラッシュ・フリーズを左手自身のフラッシュに記録し、検知したら自動で再起動する
# （止まったままにならず、左右の接続が戻る）。記録は DYA Studio の
# 「診断」→「安定性」の「周辺側 1」で読む（中継は実験的機能で、読めない場合がある）。
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_SPLIT_RELAY=y
# 低優先度キューの停止監視は右手と同じ理由で外す（10 秒止まっただけで再起動するため）
CONFIG_ZMK_WATCHDOG_FREEZE_MONITOR_LOWPRIO_QUEUE=n
