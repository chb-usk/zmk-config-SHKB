# DYA Studio お試しブランチ（cormoran/zmk main+dya, Zephyr 4.1）
# ボード名は Zephyr 4.1 の命名（seeeduino_xiao_ble → xiao_ble//zmk）。
# ドングル構成（prospector モジュール含む）は Zephyr 4.1 での動作が未確認のため、
# このブランチではノーマルモード（右手セントラル）のみビルドする。
include:
  - board: xiao_ble//zmk
    shield: shkb_l
    artifact-name: SHKB_l
  - board: xiao_ble//zmk
    shield: shkb_r
    snippet: studio-rpc-usb-uart
    artifact-name: SHKB_r

  # ── Utility ───────────────────────────────────────────────────────────
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: settings_reset
